[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "dnspython>=2.7.0",
    "pandas>=2.2.3",
    "requests>=2.32.3",
    "streamlit>=1.45.1",
    "urllib3>=2.4.0",
]

[tool.pytest.ini_options]
# Default: pytest discovers and runs the mocked-input tests in tests/.
# The live-network regression script (validate_known_v3_operators.py) is
# named without a leading 'test_' prefix so it's NOT auto-collected;
# invoke it explicitly with `python3 tests/validate_known_v3_operators.py`.
testpaths = ["tests"]
python_files = ["test_*.py"]
